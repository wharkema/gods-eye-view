# Runs the app on the NAS behind the reverse proxy (https://wharkema.nl/gods-eye-view). See docs/deploy-nas.md.
services:
  gods-eye-view:
    build:
      context: .
      # Client-side keys are compiled into the bundle at build time; compose reads them from .env
      args:
        GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
        CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}
    image: gods-eye-view:latest
    container_name: gods-eye-view
    restart: unless-stopped
    # API keys and the login account; only on the NAS, never in git
    env_file: .env
    environment:
      APP_LOGIN_VERPLICHT: "1"
      APP_COOKIE_SECURE: "1"
      APP_COOKIE_PAD: /gods-eye-view
      HOST: 0.0.0.0
      PORT: "4173"
      # Host header from nginx, plus the container's own health check
      PREVIEW_ALLOWED_HOSTS: wharkema.nl,localhost,127.0.0.1
    # Only reachable through the NAS itself (the reverse proxy), not directly from the network
    ports:
      - "127.0.0.1:8019:4173"
    # TomTom tile cache and its daily budget counter survive a rebuild
    volumes:
      - gev-cache:/app/.gev-cache

volumes:
  gev-cache:
