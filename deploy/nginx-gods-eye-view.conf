# Reverse proxy for https://wharkema.nl/gods-eye-view to the container (see docs/deploy-nas.md, step 7).
# Goes inside the server block of wharkema.nl; the container listens on 127.0.0.1:8019.

location = /gods-eye-view {
    return 301 /gods-eye-view/;
}

# ^~: always wins over Web Station's regex locations (otherwise 404 on /gods-eye-view/)
location ^~ /gods-eye-view/ {
    # The slash after the port strips /gods-eye-view from the path: the app itself runs at /
    proxy_pass http://127.0.0.1:8019/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /gods-eye-view;
    # only small posts (login form, voice debug log)
    client_max_body_size 2m;
    # some upstream feeds (flights, CCTV catalogs) take a while on a cold cache
    proxy_read_timeout 120s;
}
